syntax = "proto3";
package lms.authentication;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/authentication";
import  "authentication/authentication.proto";

message RegisterRequest {
  string organisation = 1;
  string username = 2;
  string email = 3;
  string  password = 4;
  string address = 5;
  string phone_number = 6;
  bool  mfa_verification_option = 7;
}
message  RegisterResponse {
  SystemUser registered_user = 1;
  string message = 2;
}