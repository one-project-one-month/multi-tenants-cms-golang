# .air.toml
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/main.go"
  bin = "tmp/main"
  full_bin = "./tmp/main"
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "1s"
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true