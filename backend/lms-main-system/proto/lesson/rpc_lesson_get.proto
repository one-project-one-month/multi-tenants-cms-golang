syntax = "proto3";

package lms.lesson;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/lesson";
import "lesson/lesson.proto";

message GetLessonsByModuleIdRequest {
  string module_id = 1;
}

message GetLessonsByModuleIdResponse {
  repeated Lesson lessons = 1;
}

message GetLessonByIdRequest {
  string id = 1;
}

message GetLessonByIdResponse {
  Lesson lesson = 1;
}