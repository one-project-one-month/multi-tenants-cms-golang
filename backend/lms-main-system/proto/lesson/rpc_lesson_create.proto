syntax = "proto3";

package lms.lesson;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/lesson";
import "lesson/lesson.proto";

message CreateLessonRequest {
  string title = 1;
  string content = 2;
  string material_type = 3;
  string module_id = 4;
}

message CreateLessonResponse {
  Lesson lesson=1;
}