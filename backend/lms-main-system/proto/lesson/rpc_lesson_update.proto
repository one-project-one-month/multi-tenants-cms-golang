syntax = "proto3";

package lms.lesson;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/lesson";
import "lesson/lesson.proto";

message UpdateLessonRequest {
  string id = 1;
  string title = 2;
  string content = 3;
  string material_type = 4;
  string module_id = 5;
}

message UpdateLessonResponse {
  Lesson lesson = 1;
}