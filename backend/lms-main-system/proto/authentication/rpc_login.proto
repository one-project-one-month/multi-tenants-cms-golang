syntax = "proto3";

package lms.authentication;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/authentication";


message LoginRequest {
  string organisation = 1;
  string namespace_domain_email = 2;
  string password = 3;
}

message LoginResponse {
  string message = 1;
  bool  mfa_enable = 2;
}