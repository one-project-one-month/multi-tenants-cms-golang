syntax = "proto3";

package lms.authentication;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/authentication";
import "google/protobuf/timestamp.proto";


message LoginRequest {
  string organisation = 1;
  string namespace_domain_email = 2;
  string password = 3;
}

message LoginResponse {
  string message = 1;
  string token = 2;
  bool  mfa_enable = 3;
  google.protobuf.Timestamp expires_at = 4;
}