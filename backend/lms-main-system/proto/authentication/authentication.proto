syntax = "proto3";

package lms.authentication;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/authentication";
import "google/protobuf/timestamp.proto";


// Is equal to the LMS USER
message  SystemUser {
  string id = 1;
  string  username = 2;
  string email = 3;
  string phone_number = 4;
  string address = 5;
  bool  email_verified = 6;
  bool  mfa_enable = 7;
  google.protobuf.Timestamp registration_date = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
