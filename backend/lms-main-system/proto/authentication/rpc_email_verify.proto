syntax = "proto3";

package lms.authentication;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/authentication";
import "google/protobuf/timestamp.proto";


message  EmailVerifyRequest {
  string  organisation = 1;
  string email = 2;
  string token = 3;
}
message  EmailVerifyResponse {
  string message = 1;
}