syntax = "proto3";

package lms.modules;

option go_package = "github.com/multi-tenant-cms-doc-golang/lms-sys/protogen/module";

import "modules/module.proto";

message UpdateModuleRequest {
    string module_id   = 1;
    string module_name = 2;
    string course_id   = 3;
    string description = 4;
}

message UpdateModuleResponse {
    Module module = 1;
}
