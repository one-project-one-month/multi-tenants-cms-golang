syntax = "proto3";

package lms.modules;

option go_package = "github.com/multi-tenant-cms-doc-golang/lms-sys/protogen/module";

import "google/protobuf/timestamp.proto";

message Module {
    string                    module_id   = 1;
    string                    module_name = 2;
    string                    course_id   = 3;
    string                    description = 4;
    google.protobuf.Timestamp created_at  = 5;
    google.protobuf.Timestamp updated_at  = 6;
}
