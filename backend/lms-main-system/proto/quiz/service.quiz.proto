syntax = "proto3";
package lms.quiz;
option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/quiz";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/api/annotations.proto";
import "quiz/rpc_quiz_get.proto";
import "quiz/rpc_quiz_create.proto";
import "quiz/rpc_quiz_update.proto";
import "quiz/rpc_quiz_delete.proto";
import "quiz/quiz.proto";
import "google/protobuf/empty.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "LMS Quiz Endpoints";
    version: "1.0";
    description: "APIs for Quiz in the Learning Management System";
    contact: {
      name: "LMS Team";
      url: "https://lms.example.com/support";
      email: "support@lms.example.com";
    };
    license: {
      name: "Apache 2.0";
      url: "https://www.apache.org/licenses/LICENSE-2.0.html";
    };
  };
  schemes: HTTPS;
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
  host: "localhost:8086";
  base_path: "/v1";
  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Authentication token, prefixed with Bearer";
      }
    }
  };
  security: {
    security_requirement: {
      key: "Bearer";
      value: {};
    }
  }
};

service QuizService {
  rpc CreateQuiz(CreateQuizRequest) returns (QuizResponse) {
    option (google.api.http) = {
      post: "/lms/v1/quiz"
      body: "*"
    };
  }

  rpc GetQuizzesByModule(GetQuizByModuleRequest) returns (GetQuizByModuleResponse) {
    option (google.api.http) = {
      get: "/lms/v1/quiz/modules"
    };
  }

  rpc UpdateQuiz(UpdateQuizRequest) returns (Question) {
    option (google.api.http) = {
      put: "/lms/v1/quiz/{question_id}"
      body: "*"
    };
  }

  rpc DeleteQuiz(DeleteQuizRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/lms/v1/quiz"
    };
  }
}