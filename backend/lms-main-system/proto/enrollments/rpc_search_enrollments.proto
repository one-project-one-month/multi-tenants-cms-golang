syntax = "proto3";

package lms.enrollments;

option go_package = "github.com/multi-tenant-cms-golang/lms-sys/protogen/enrollment";

import "enrollments/enrollment.proto";

message SearchEnrollmentsRequest { 
  optional string student_email = 2;
  optional string course_id = 3;
  optional string category_id = 4;
}

message SearchEnrollmentsResponse { repeated EnrollmentResponse enrollments = 1; }
