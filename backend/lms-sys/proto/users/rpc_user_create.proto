syntax = "proto3";
package lms.users;
option go_package = "github.com/multi-tenant-cms-doc-golang/lms-sys/protogen/lms_user";

import "users/users.proto";

message CreateLMSUserRequest {
  string lms_email = 1;
  string lms_role_id = 2;
  string tenants_id = 3;
  string address = 4;
  string phone_number = 5;
}

message CreateLMSUserResponse {
  Users user_response = 1;
}
