syntax = "proto3";

package  lms.course;

option go_package = "github.com/multi-tenants-cms-golang/lms-sys/protogen/course";

import "courses/course.proto";

message  GetCourseRequest {
  string  course_title = 1;
}

message GetCourseResponse {
  string  course_title = 1;
}

message GetCourseByIDRequest {
  int64 course_id = 1;
}

message GetCourseByIDResponse {
  Course course = 1;
}