syntax = "proto3";

package lms.modules;

option go_package = "github.com/multi-tenant-cms-doc-golang/lms-sys/protogen/module";

import "module/module.proto";

message DeleteModulesRequest {
    repeated string ids          = 1;
    bool            force_delete = 2;
}

message DeleteModulesResponse {
    string message = 1;
}
