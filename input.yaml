base-url: "http://localhost:9000"
routes:
  - "/login"
  - "/register"
  - "/verify-email"

test-cases:
  - target: "/login"
    request:
      method: POST
      headers:
        Content-Type: application/json
      body:
        username: "testuser"
        password: "password123"

  - target: "/register"
    request:
      method: POST
      headers:
        Content-Type: application/json
      body:
        username: "Swan"
        password: "SwanHtet12@"
        email: "swanhtetaungp@gmail.com"
    expected:
      success:
        status-code: 201
        body-return: "Ur email verification is sent to your mail "
      failure:
        status-code: [500, 404,so on]

  - target: "/verify-email"
    depend-on:
      - "/register"
    external-integration: true
    request:
      method: POST
      headers:
        Content-Type: application/json
      body:
        email: "swanhtetaungp@gmail.com"
        code: "Prompt the user to input the code from actual email and test"
    expected:
      success:
        status-code: 201
        body-return: "Ur email verification is sent to your mail "
      failure:
        status-code: [ 500, 404,so on ]

  - target: "/get-me"
    depend-on:
      - "/verify"
    auth:
      jwt: true
    external-integration: true
    request:
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer {code from depended response}"
      body:
        email: "swanhtetaungp@gmail.com"
        code: "Prompt the user to input the code from actual email and test"
    expected:
      success:
        status-code: 201
        body-return: "Ur email verification is sent to your mail "
      failure:
        status-code: [ 500, 404,so on ]