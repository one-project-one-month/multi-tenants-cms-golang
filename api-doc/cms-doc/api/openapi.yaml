openapi: 3.0.0
info:
  description: API documentation for the CMS Multi-Tenant System with MFA support
  title: CMS Multi-Tenant System API
  version: 1.0.0
servers:
- description: Local development server
  url: http://localhost:8081
tags:
- description: User authentication and authorization
  name: Authentication
- description: Multi-Factor Authentication endpoints
  name: MFA
- description: Owner management
  name: Owners
- description: Page creation requests management
  name: Page Requests
paths:
  /auth/login:
    post:
      description: Authenticate user with email/password and MFA code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFALoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: Login successful
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
      summary: User login with MFA
      tags:
      - Authentication
  /auth/register:
    post:
      description: Register a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: User registered successfully
        "400":
          description: Invalid request
        "409":
          description: Email already exists
        "500":
          description: Internal server error
      summary: User registration
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Invalidate user's access and refresh tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_auth_logout_post_request'
      responses:
        "200":
          description: Logout successful
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Authentication
  /auth/refresh:
    post:
      description: Get new access token using refresh token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Token refreshed successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
      summary: Refresh token
      tags:
      - Authentication
  /auth/me:
    post:
      description: Get current user's profile information
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User information retrieved successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Authentication
  /auth/profile/{id}:
    put:
      description: Update user's profile information
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User profile updated
        "400":
          description: Invalid request
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Authentication
  /auth/mfa/setup:
    post:
      description: Initialize MFA setup for a user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
          description: MFA setup initiated
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Setup MFA
      tags:
      - MFA
  /auth/mfa/verify:
    post:
      description: Verify MFA setup with a verification code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerificationRequest'
        required: true
      responses:
        "200":
          description: MFA setup completed successfully
        "400":
          description: Invalid request
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Verify MFA setup
      tags:
      - MFA
  /owners:
    delete:
      description: Delete one or more owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerDeleteRequest'
        required: true
      responses:
        "200":
          description: Owner(s) deleted
        "400":
          description: Invalid request
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Delete owners
      tags:
      - Owners
    get:
      description: Retrieve a list of all owners
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OwnerResponse'
                type: array
          description: Owners fetched
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Get all owners
      tags:
      - Owners
    post:
      description: Create a new owner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
          description: Owner created
        "400":
          description: Invalid request
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Create owner
      tags:
      - Owners
  /owners/{id}:
    get:
      description: Retrieve a single owner by their ID
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
          description: Fetched owner
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Get owner by ID
      tags:
      - Owners
    put:
      description: Update an existing owner
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
          description: Owner updated
        "400":
          description: Invalid request
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Update owner
      tags:
      - Owners
  /page-request:
    get:
      description: Retrieve paginated list of page requests
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_page_request_get_200_response'
          description: Page requests retrieved successfully
        "400":
          description: Invalid query parameters
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Get all page requests
      tags:
      - Page Requests
    post:
      description: Create a new page request with optional logo upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRequestResponse'
          description: Page request created
        "400":
          description: Invalid request
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Create page request
      tags:
      - Page Requests
components:
  schemas:
    AuthResponse:
      example:
        access_token: access_token
        refresh_token: refresh_token
        expires_at: 2000-01-23T04:56:07.000+00:00
        user:
          role: role
          updated_at: 2000-01-23T04:56:07.000+00:00
          name: name
          verified: true
          created_at: 2000-01-23T04:56:07.000+00:00
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          email: email
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          format: date-time
          type: string
      type: object
    MFASetupResponse:
      example:
        qr_code_image: qr_code_image
        token_id: 0
        secret: secret
        manual_entry: manual_entry
        qr_code_url: qr_code_url
      properties:
        secret:
          description: The TOTP secret key
          type: string
        qr_code_url:
          description: URL to generate QR code
          type: string
        qr_code_image:
          description: Base64 encoded PNG of QR code
          type: string
        token_id:
          description: Temporary token ID for verification
          type: integer
        manual_entry:
          description: Secret key for manual entry
          type: string
      type: object
    MFAVerificationRequest:
      example:
        code: code
        token_id: 0
      properties:
        token_id:
          description: Temporary token ID from setup
          type: integer
        code:
          description: 6-digit verification code from authenticator app
          type: string
      required:
      - code
      - token_id
      type: object
    MFALoginRequest:
      example:
        password: password
        email: email
        mfa_code: mfa_code
      properties:
        email:
          format: email
          type: string
        password:
          type: string
        mfa_code:
          description: 6-digit MFA code from authenticator app
          type: string
      required:
      - email
      - mfa_code
      - password
      type: object
    UserResponse:
      example:
        role: role
        updated_at: 2000-01-23T04:56:07.000+00:00
        name: name
        verified: true
        created_at: 2000-01-23T04:56:07.000+00:00
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        email: email
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        email:
          format: email
          type: string
        role:
          type: string
        verified:
          type: boolean
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    TokenResponse:
      example:
        access_token: access_token
        refresh_token: refresh_token
        expires_at: 2000-01-23T04:56:07.000+00:00
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          format: date-time
          type: string
      type: object
    OwnerResponse:
      example:
        role: role
        name_space: name_space
        name: name
        verified: true
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        email: email
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        email:
          format: email
          type: string
        role:
          type: string
        name_space:
          type: string
        verified:
          type: boolean
      type: object
    PageRequestResponse:
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        requestType: requestType
        description: description
        pageUrl: pageUrl
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        title: title
        logoUrl: logoUrl
      properties:
        id:
          format: uuid
          type: string
        ownerId:
          format: uuid
          type: string
        requestType:
          type: string
        title:
          type: string
        description:
          type: string
        pageUrl:
          nullable: true
          type: string
        logoUrl:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
      type: object
    LoginRequest:
      properties:
        email:
          format: email
          type: string
        password:
          minLength: 6
          type: string
      required:
      - email
      - password
      type: object
    RegisterRequest:
      example:
        password: password
        role: role
        name: name
        email: email
      properties:
        name:
          minLength: 2
          type: string
        email:
          format: email
          type: string
        password:
          minLength: 6
          type: string
        role:
          type: string
      required:
      - email
      - name
      - password
      type: object
    RefreshTokenRequest:
      example:
        refresh_token: refresh_token
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    OwnerCreateRequest:
      example:
        password: password
        name: name
        namespace: namespace
        email: email
      properties:
        name:
          minLength: 2
          type: string
        email:
          format: email
          type: string
        namespace:
          minLength: 3
          type: string
        password:
          minLength: 6
          type: string
      required:
      - email
      - name
      - namespace
      - password
      type: object
    OwnerUpdateRequest:
      example:
        name: name
        namespace: namespace
      properties:
        name:
          minLength: 2
          type: string
        namespace:
          minLength: 3
          type: string
      required:
      - name
      - namespace
      type: object
    GetMeRequest:
      example:
        email: email
      properties:
        email:
          format: email
          type: string
      required:
      - email
      type: object
    UserUpdateRequest:
      example:
        name: name
      properties:
        name:
          minLength: 2
          type: string
      required:
      - name
      type: object
    PaginateRequest:
      properties:
        page:
          type: integer
        limit:
          type: integer
      type: object
    CreatePageRequest:
      properties:
        ownerId:
          format: uuid
          type: string
        requestType:
          type: string
        title:
          type: string
        description:
          type: string
        pageUrl:
          nullable: true
          type: string
        logo:
          format: binary
          type: string
      required:
      - description
      - ownerId
      - requestType
      - title
      type: object
    OwnerDeleteRequest:
      example:
        forceDelete: true
        ids:
        - ids
        - ids
      properties:
        ids:
          items:
            type: string
          type: array
        forceDelete:
          type: boolean
      required:
      - ids
      type: object
    Pagination:
      example:
        total: 0
        limit: 1
        totalPages: 5
        page: 6
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      type: object
    _auth_logout_post_request:
      properties:
        refresh_token:
          type: string
      type: object
    _page_request_get_200_response:
      example:
        pagination:
          total: 0
          limit: 1
          totalPages: 5
          page: 6
        data:
        - createdAt: 2000-01-23T04:56:07.000+00:00
          requestType: requestType
          description: description
          pageUrl: pageUrl
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          logoUrl: logoUrl
        - createdAt: 2000-01-23T04:56:07.000+00:00
          requestType: requestType
          description: description
          pageUrl: pageUrl
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          ownerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          title: title
          logoUrl: logoUrl
      properties:
        data:
          items:
            $ref: '#/components/schemas/PageRequestResponse'
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
