services:
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    networks:
      - whole-system-network
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
    command: >
      consul agent -dev
      -client=0.0.0.0
      -bind=0.0.0.0
      -datacenter=dc1
      -ui
      -log-level=INFO
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: gateway
    networks:
      - whole-system-network
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_ADDRESS=0.0.0.0
    depends_on:
      consul:
        condition: service_healthy

  cms-main-system:
    build:
      context: ./backend/cms-sys
      dockerfile: Dockerfile
    networks:
      - whole-system-network
    depends_on:
      postgres-cms:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      - NATS_URL=nats://nats:4222
      - DB_HOST=postgres-cms
      - DB_PORT=5432
      - DB_NAME=cms_db
      - DB_USER=postgres
      - DB_PASSWORD=cms_password_123
      - APP_ENV=development
      - LOG_LEVEL=info
      - LOG_FILE_PATH=/app/logs/app.log
      - LOG_MAX_SIZE=100
      - LOG_MAX_BACKUPS=3
      - LOG_MAX_AGE=28
      - LOG_COMPRESS=true
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - LOG_CONSOLE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      # Consul Configuration
      - CONSUL_ENABLED=true
      - CONSUL_ADDRESS=consul:8500
      - CONSUL_DATACENTER=dc1
      - CONSUL_TOKEN=
      - CONSUL_SCHEME=http
      - CONSUL_SERVICE_ID=cms-api-1
      - CONSUL_SERVICE_NAME=cms-service
      - CONSUL_SERVICE_TAGS=cms,multi-tenant,api,v1,environment:development
      - CONSUL_CHECK_TTL=30s
      - CONSUL_CHECK_ID=service-check-cms-api-1
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - whole-system-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-cms:
    image: postgres:15-alpine
    container_name: postgres-cms
    environment:
      - POSTGRES_DB=cms_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cms_password_123
    volumes:
      - postgres-cms:/var/lib/postgresql/data
    networks:
      - whole-system-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-lms:
    image: postgres:15-alpine
    container_name: postgres-lms
    environment:
      - POSTGRES_DB=lms_db
      - POSTGRES_USER=lms_user
      - POSTGRES_PASSWORD=lms_password
    volumes:
      - postgres-lms:/var/lib/postgresql/data
    networks:
      - whole-system-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  email-service:
    build:
      context: ./backend/email-service
      dockerfile: Dockerfile
    networks:
      - whole-system-network
    ports:
      - "8082:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_ADDR=${FROM_ADDR}
      - STREAM_NAME=email-stream
      - SUBJECT_TO=email.send
      - CONSUMER_NAME=email-consumer
      - TEMPLATE_DIR=./templates
      - SERVER_PORT=8080
      # Consul Configuration (if email service also uses Consul)
      - CONSUL_ENABLED=true
      - CONSUL_ADDRESS=consul:8500
      - CONSUL_DATACENTER=dc1
      - CONSUL_TOKEN=
      - CONSUL_SCHEME=http
      - CONSUL_SERVICE_ID=email-service-1
      - CONSUL_SERVICE_NAME=email-service
      - CONSUL_SERVICE_TAGS=email,messaging,service,v1,environment:development
      - CONSUL_CHECK_TTL=30s
    depends_on:
      - nats
      - consul
    restart: unless-stopped

  # lms-main-system:
