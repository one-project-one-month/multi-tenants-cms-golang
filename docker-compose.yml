  nats:
    image: nats:latest
    container_name: nats
    networks:
      - whole-system-network
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8083:8080"
    networks:
      - whole-system-network
    restart: unless-stopped
    environment:
      - DOZZLE_LEVEL=${DOZZLE_LEVEL}
      - DOZZLE_TAIL=${DOZZLE_TAIL}

networks:
  whole-system-network:
    driver: bridge

volumes:
  postgres-cms:
    driver: local
  postgres-lms:
    driver: local
  redis-data:
    driver: local
  consul-data:
    driver: local
  consul-config:
    driver: local
